<DOCTYPE! html>
  <html lang="en">
    <head>
      <title>Travelbetter Tools - Temperature Converter</title>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="description" content="Convert easily between Celsius (Centigrade), Fahrenheit and Kelvin" />
     <meta charset="UTF-8">
    <script src="temperature-converter.js" defer></script>
    <link rel="stylesheet" href="https://tools.travelbetter.co.uk/lib/travelbetter-tools.css">
</head>
<body>
   <div class="tb-navbar">
        <ul>
          <li><a href="https://travelbetter.co.uk">Travelbetter</a></li>
          <li><a href="https://tools.travelbetter.co.uk/index.html">Tools</a></li>
        </ul>
       </div>
      <h1>Temperature Converter</h1>
      <div class="display-card">
      <p>Convert easily between Celsius (Centigrade), Fahrenheit and Kelvin.</p>
    </div>
    
    <div class="display-card">
        <table id="convertTable">
        <tr>
            <td><label for="celsius">Celsius </label></td>
            <td><input type="number" id="celcius" onkeyup="convertCelcius()" /></td>
            <td> °C</td>
        </tr>

        <tr>
            <td><label for="celsius">Fahrenheit </label></td>
            <td><input type="number" id="celcius" onkeyup="convertFahrenheit()" /></td>
            <td> °F</td>
        </tr>
          
        <tr>
            <td><label for="celsius">Kelvin </label></td>
            <td><input type="number" id="celcius" onkeyup="convertKelvin()" /></td>
            <td> K</td>
        </tr>
        
            
       
        </table>
        
        <button class="convert-button" onclick="clearValues()">Clear</button>
        
         </div>
      <div class="display-card" hidden id="results">
      </div>
       <div class="display-card" hidden id="formula">
       </div>
    </body>
  </html>
